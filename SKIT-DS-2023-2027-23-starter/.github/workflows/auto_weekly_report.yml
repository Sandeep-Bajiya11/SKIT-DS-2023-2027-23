name: Weekly Progress Report Auto-Commit

on:
  schedule:
    # Thursday 18:29 UTC = Friday? No: 18:29 UTC Thursday is 23:59 IST Thursday.
    - cron: "29 18 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install report dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate weekly Form-3 PDF
        run: python generate_report.py weekly

      - name: Archive and commit PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p weekly_reports
          mv *_Weekly_Progress_Report_Form-3_*.pdf weekly_reports/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly_reports/
          if git diff --cached --quiet; then
            echo "No new report changes to commit."
          else
            git commit -m "docs: archive weekly Form-3 report [skip ci]"
            git push
          fi
